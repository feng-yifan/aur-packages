name: upstream-check

# Daily check of the upstream release. Reconciles upstream -> GitHub -> AUR:
# updates PKGBUILD/.SRCINFO, builds + namcap-verifies, commits to GitHub, and
# (when AUR_AUTOPUBLISH=true) publishes to the AUR.

on:
  schedule:
    - cron: '0 6 * * *'   # every day at 06:00 UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run: build/verify only, do not push commits or publish to AUR'
        type: boolean
        default: true

permissions:
  contents: write
  issues: write

concurrency:
  group: aur-twilight-echo
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
      options: --user root
    env:
      PKG: twilight-echo-bin
      UPSTREAM_REPO: Px-asen/Twilight_Echo
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}
      AUR_AUTOPUBLISH: ${{ vars.AUR_AUTOPUBLISH || 'false' }}
      GH_TOKEN: ${{ github.token }}
      AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
      AUR_KNOWN_HOSTS: ${{ secrets.AUR_KNOWN_HOSTS }}
    steps:
      - name: Install tooling
        run: pacman -Syu --noconfirm --needed git openssh jq curl namcap github-cli sudo

      - name: Checkout
        uses: actions/checkout@v4

      - name: Create build user
        run: |
          useradd -m builder || true
          echo 'builder ALL=(ALL) NOPASSWD: ALL' > /etc/sudoers.d/builder

      - name: Fix workspace ownership
        run: chown -R builder:builder "$GITHUB_WORKSPACE"

      - name: Run upstream check pipeline
        run: |
          sudo -u builder \
            env PKG="$PKG" UPSTREAM_REPO="$UPSTREAM_REPO" DRY_RUN="$DRY_RUN" \
                AUR_AUTOPUBLISH="$AUR_AUTOPUBLISH" GH_TOKEN="$GH_TOKEN" \
                AUR_SSH_PRIVATE_KEY="$AUR_SSH_PRIVATE_KEY" AUR_KNOWN_HOSTS="$AUR_KNOWN_HOSTS" \
                GITHUB_REPOSITORY="$GITHUB_REPOSITORY" GITHUB_REF_NAME="$GITHUB_REF_NAME" \
                GITHUB_SERVER_URL="$GITHUB_SERVER_URL" HOME=/home/builder \
            bash scripts/pipeline.sh check
